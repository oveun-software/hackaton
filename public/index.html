<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Find relevant CVs and understand every recommendation with source evidence.">
  <title>TalentLens · CV discovery</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css"><script type="module" src="/app.js"></script>
<link rel="stylesheet" href="evidence.css"></head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#overview" id="brand"><img class="brand-mark" src="/logo.svg" alt=""><span>TalentLens<span class="brand-sub" id="brand-tagline"></span></span></a>
      <div class="workspace"><span class="workspace-avatar">TL</span><div><span id="workspace-name"></span><small id="workspace-subtitle"></small></div><span class="workspace-dot"></span></div>
      <p class="nav-label" id="nav-label"></p>
      <nav id="navigation"></nav>
      <div class="sidebar-bottom"><div class="lab-card"><span class="lab-label" id="product-note-label"></span><strong id="product-note-title"></strong><p id="product-note-body"></p></div><div class="profile"><span class="profile-avatar">TL</span><div><span id="profile-name"></span><small id="profile-subtitle"></small></div><span class="local-light"></span></div></div>
    </aside>
    <div class="main-shell">
      <header class="topbar"><div class="breadcrumbs"><span class="breadcrumb" id="workspace-crumb"></span><span class="slash">/</span><span id="page-crumb"></span></div><div class="topbar-right"><div class="language-switch" id="language-switch" role="group"></div><button id="help-button" class="help-button" type="button">?</button><button id="new-vacancy" class="button button-dark button-small"></button></div></header>
      <a id="recorded-demo-link" class="recorded-link" href="showcase.html">Explore the recorded demo</a><main id="main" tabindex="-1"></main>
      <footer><span>TALENTLENS <span class="footer-sep">/</span><span id="footer-by"></span></span><span id="footer-decision"></span></footer>
    </div>
  </div>
  <dialog id="vacancy-dialog" aria-labelledby="dialog-title"></dialog>
  <dialog id="document-dialog" aria-labelledby="document-title"></dialog>
  <dialog id="help-dialog" aria-labelledby="help-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <input id="file-input" type="file" accept=".pdf,.docx,.txt" multiple hidden>
  <input id="update-file-input" type="file" accept=".pdf,.docx,.txt" hidden>
</body>
</html>
